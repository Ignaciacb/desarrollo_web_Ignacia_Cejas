{% extends "auth/base.html" %}

{% block css %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/stats.css') }}"
    />
{% endblock %}

{% block content %}
<div class="stats-container">
    <figure class="highcharts-figure">
        <div id="container"></div>
    </figure>

    <figure class="highcharts-figure">
        <div id="container2"></div>
    </figure>

    <figure class="highcharts-figure">
        <div id="container3"></div>
    </figure>

  <div style="text-align: center; margin-top: 30px;">
    <a href="{{ url_for('index') }}" class="btn btn--primary">Volver a la portada</a>
  </div>
</div>
{% endblock content %}

{% block javascript %}
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="{{url_for('static', filename='js/graficoDiario.js')}}"></script>
<script src="{{url_for('static', filename='js/graficoTorta.js')}}"></script>
<script src="{{url_for('static', filename='js/graficoMensual.js')}}"></script>
{% endblock %}
